<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Milano Seal Core Brain Feather M</title>
  <desc id="desc">Transparent animation-ready SVG core mark with gold M, feather, brain-routing linework, orbital rings, and route nodes.</desc>
  <defs>
    <linearGradient id="msCoreGold" x1="8%" y1="8%" x2="94%" y2="92%">
      <stop offset="0%" stop-color="#fff5bf"/>
      <stop offset="16%" stop-color="#f7d77e"/>
      <stop offset="34%" stop-color="#a96f18"/>
      <stop offset="52%" stop-color="#fff0aa"/>
      <stop offset="72%" stop-color="#c38b2c"/>
      <stop offset="100%" stop-color="#6d430c"/>
    </linearGradient>
    <linearGradient id="msCoreLine" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#8b5e16" stop-opacity="0"/>
      <stop offset="35%" stop-color="#d8ae4f" stop-opacity="0.72"/>
      <stop offset="50%" stop-color="#fff2b8" stop-opacity="1"/>
      <stop offset="65%" stop-color="#d8ae4f" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#8b5e16" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="msCoreNode" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#fff7c8"/>
      <stop offset="42%" stop-color="#f4c85f"/>
      <stop offset="78%" stop-color="#a86614"/>
      <stop offset="100%" stop-color="#3a2105"/>
    </radialGradient>
    <filter id="msCoreGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.95 0 1 0 0 0.62 0 0 1 0 0.12 0 0 0 0.95 0" result="goldBlur"/>
      <feMerge><feMergeNode in="goldBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="msSoftShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.65"/>
    </filter>
    <style>
      .ms-orbit,.ms-brain,.ms-circuit,.ms-ring{fill:none;stroke:url(#msCoreGold);stroke-linecap:round;stroke-linejoin:round;filter:url(#msCoreGlow)}
      .ms-orbit{stroke-width:3;opacity:.78}.ms-brain{stroke-width:6;opacity:.9}.ms-circuit{stroke-width:5;opacity:.82}.ms-ring{stroke-width:4;opacity:.72}
      .ms-dotted{stroke:url(#msCoreGold);stroke-width:3;stroke-dasharray:3 16;opacity:.55;fill:none;stroke-linecap:round}
      .ms-node{fill:url(#msCoreNode);stroke:#fff2b8;stroke-width:3;filter:url(#msCoreGlow)}
      .ms-m{font-family:Georgia,'Times New Roman',serif;font-weight:600;font-size:330px;letter-spacing:-.08em;fill:url(#msCoreGold);filter:url(#msSoftShadow)}
      .ms-feather-fill{fill:url(#msCoreGold);filter:url(#msCoreGlow)}
      .ms-feather-cut{fill:none;stroke:#241304;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;opacity:.92}
      .ms-stem{stroke:url(#msCoreGold);stroke-width:9;stroke-linecap:round;filter:url(#msCoreGlow)}
      @media (prefers-reduced-motion:no-preference){
        .ms-core-pulse{transform-origin:512px 512px;animation:msCorePulse 6.5s ease-in-out infinite}.ms-route-draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:msDraw 2.4s ease-out forwards}.ms-node-wake{transform-origin:center;animation:msNodeWake 1.4s ease-out both}
        @keyframes msCorePulse{0%,100%{opacity:.78;transform:scale(.985)}50%{opacity:1;transform:scale(1.015)}}
        @keyframes msDraw{to{stroke-dashoffset:0}}
        @keyframes msNodeWake{0%{opacity:0;transform:scale(.45)}70%{opacity:1;transform:scale(1.14)}100%{opacity:1;transform:scale(1)}}
      }
    </style>
  </defs>
  <g class="ms-core-pulse">
    <!-- outer intelligent route orbit -->
    <ellipse class="ms-orbit ms-route-draw" cx="512" cy="512" rx="410" ry="118" transform="rotate(-14 512 512)"/>
    <ellipse class="ms-orbit ms-route-draw" cx="512" cy="512" rx="392" ry="104" transform="rotate(28 512 512)" opacity=".62"/>
    <circle class="ms-ring ms-route-draw" cx="512" cy="512" r="350"/>
    <circle class="ms-dotted" cx="512" cy="512" r="292"/>
    <!-- symmetrical brain-routing outline -->
    <path class="ms-brain ms-route-draw" d="M501 260 C455 215 376 229 345 286 C289 293 253 340 260 397 C213 425 210 493 254 532 C222 600 261 666 327 676 C344 742 425 767 501 707"/>
    <path class="ms-brain ms-route-draw" d="M523 260 C569 215 648 229 679 286 C735 293 771 340 764 397 C811 425 814 493 770 532 C802 600 763 666 697 676 C680 742 599 767 523 707"/>
    <path class="ms-stem ms-route-draw" d="M512 224 L512 800" opacity=".88"/>
    <!-- circuit branches left -->
    <path class="ms-circuit ms-route-draw" d="M400 336 C366 336 349 352 349 380 L349 428 L316 428"/>
    <path class="ms-circuit ms-route-draw" d="M408 438 L340 438 L340 500 L301 500"/>
    <path class="ms-circuit ms-route-draw" d="M404 560 L344 560 L344 610 L305 610"/>
    <path class="ms-circuit ms-route-draw" d="M426 676 C394 704 372 735 372 772"/>
    <!-- circuit branches right -->
    <path class="ms-circuit ms-route-draw" d="M624 336 C658 336 675 352 675 380 L675 428 L708 428"/>
    <path class="ms-circuit ms-route-draw" d="M616 438 L684 438 L684 500 L723 500"/>
    <path class="ms-circuit ms-route-draw" d="M620 560 L680 560 L680 610 L719 610"/>
    <path class="ms-circuit ms-route-draw" d="M598 676 C630 704 652 735 652 772"/>
    <!-- central M mark -->
    <text x="314" y="655" class="ms-m">M</text>
    <!-- canonical feather integrated through M -->
    <path class="ms-feather-fill" d="M493 690 C520 598 566 496 654 330 C610 374 568 431 531 505 C503 561 485 620 493 690Z"/>
    <path class="ms-feather-cut" d="M538 638 C579 548 617 454 661 337"/>
    <path class="ms-feather-cut" d="M572 520 C617 503 650 472 681 420" stroke-width="7"/>
    <path class="ms-feather-cut" d="M548 574 C586 558 617 530 649 482" stroke-width="7"/>
    <path class="ms-feather-cut" d="M523 628 C556 614 583 590 611 550" stroke-width="7"/>
    <!-- nodes -->
    <circle class="ms-node ms-node-wake" cx="512" cy="158" r="20"/>
    <circle class="ms-node ms-node-wake" cx="512" cy="866" r="20"/>
    <circle class="ms-node ms-node-wake" cx="146" cy="512" r="20"/>
    <circle class="ms-node ms-node-wake" cx="878" cy="512" r="20"/>
    <circle class="ms-node ms-node-wake" cx="316" cy="428" r="11"/>
    <circle class="ms-node ms-node-wake" cx="301" cy="500" r="11"/>
    <circle class="ms-node ms-node-wake" cx="305" cy="610" r="11"/>
    <circle class="ms-node ms-node-wake" cx="372" cy="772" r="11"/>
    <circle class="ms-node ms-node-wake" cx="708" cy="428" r="11"/>
    <circle class="ms-node ms-node-wake" cx="723" cy="500" r="11"/>
    <circle class="ms-node ms-node-wake" cx="719" cy="610" r="11"/>
    <circle class="ms-node ms-node-wake" cx="652" cy="772" r="11"/>
  </g>
</svg>
