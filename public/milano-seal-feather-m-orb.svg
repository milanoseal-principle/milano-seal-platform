<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Milano Seal Feather M Assistant Orb</title>
  <desc id="desc">Transparent SVG assistant orb with feathered M crest, gold orbital rings, nodes, light trails, and animation-ready layers.</desc>
  <defs>
    <radialGradient id="msBlackCore" cx="46%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#18130a"/>
      <stop offset="38%" stop-color="#070604"/>
      <stop offset="72%" stop-color="#020201"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="msCoreGlow" cx="50%" cy="46%" r="58%">
      <stop offset="0%" stop-color="#fff2b8" stop-opacity="0.42"/>
      <stop offset="36%" stop-color="#d8ae4f" stop-opacity="0.18"/>
      <stop offset="72%" stop-color="#8a5a13" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="msGold" x1="8%" y1="8%" x2="92%" y2="92%">
      <stop offset="0%" stop-color="#fff5bf"/>
      <stop offset="16%" stop-color="#f5cf72"/>
      <stop offset="34%" stop-color="#a96f18"/>
      <stop offset="52%" stop-color="#fff0aa"/>
      <stop offset="70%" stop-color="#c38b2c"/>
      <stop offset="100%" stop-color="#6d430c"/>
    </linearGradient>

    <linearGradient id="msGoldSoft" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#8b5e16" stop-opacity="0"/>
      <stop offset="30%" stop-color="#d8ae4f" stop-opacity="0.55"/>
      <stop offset="52%" stop-color="#fff2b8" stop-opacity="0.95"/>
      <stop offset="72%" stop-color="#d8ae4f" stop-opacity="0.58"/>
      <stop offset="100%" stop-color="#8b5e16" stop-opacity="0"/>
    </linearGradient>

    <filter id="msGoldGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.95  0 1 0 0 0.62  0 0 1 0 0.12  0 0 0 0.95 0" result="goldBlur"/>
      <feMerge>
        <feMergeNode in="goldBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="msShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.82"/>
    </filter>

    <filter id="msSoftBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <style>
      :root {
        --ms-gold: #d8ae4f;
        --ms-light-gold: #fff2b8;
      }

      #ms-orb { transform-origin: 512px 512px; animation: ms-orb-float 6.5s ease-in-out infinite; }
      #ms-outer-rings, #ms-nodes, #ms-trails { transform-origin: 512px 512px; }
      #ms-outer-rings { animation: ms-spin 38s linear infinite; }
      #ms-trails { animation: ms-spin-reverse 52s linear infinite; }
      #ms-nodes { animation: ms-spin 46s linear infinite; }

      .ms-draw { stroke-dasharray: 1800; stroke-dashoffset: 1800; animation: ms-draw 2.2s cubic-bezier(.22,1,.36,1) forwards; }
      .ms-draw.delay-1 { animation-delay: .16s; }
      .ms-draw.delay-2 { animation-delay: .32s; }
      .ms-draw.delay-3 { animation-delay: .48s; }

      .ms-node { transform-origin: center; animation: ms-node-pulse 2.7s ease-in-out infinite; }
      .ms-node:nth-child(2n) { animation-delay: .45s; }
      .ms-node:nth-child(3n) { animation-delay: .9s; }

      #ms-monogram { opacity: 0; transform-origin: 512px 512px; animation: ms-monogram-reveal 1.4s cubic-bezier(.22,1,.36,1) .68s forwards; }
      #ms-feather-main { opacity: 0; transform-origin: 512px 512px; animation: ms-feather-reveal 1.25s cubic-bezier(.22,1,.36,1) .92s forwards; }
      #ms-bottom-feather { opacity: 0; transform-origin: 620px 706px; animation: ms-bottom-feather-in 1.45s cubic-bezier(.22,1,.36,1) 1.15s forwards; }
      #ms-light-sweep { stroke-dasharray: 900; stroke-dashoffset: 900; animation: ms-sweep 1.25s ease-out 1.55s forwards; }
      #ms-assistant-flare { opacity: 0; animation: ms-flare 2.2s ease-out 1.7s infinite; }

      @keyframes ms-orb-float { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-10px) scale(1.012); } }
      @keyframes ms-spin { to { transform: rotate(360deg); } }
      @keyframes ms-spin-reverse { to { transform: rotate(-360deg); } }
      @keyframes ms-draw { to { stroke-dashoffset: 0; } }
      @keyframes ms-monogram-reveal { 0% { opacity:0; transform: scale(.86) translateY(24px); clip-path: circle(0% at 50% 52%); } 70% { opacity:1; clip-path: circle(72% at 50% 52%); } 100% { opacity:1; transform: scale(1) translateY(0); clip-path: circle(160% at 50% 52%); } }
      @keyframes ms-feather-reveal { 0% { opacity:0; transform: translate(28px,42px) rotate(14deg) scale(.72); clip-path: inset(100% 0 0 0); } 100% { opacity:1; transform: translate(0,0) rotate(0) scale(1); clip-path: inset(0 0 0 0); } }
      @keyframes ms-bottom-feather-in { 0% { opacity:0; transform: translate(180px,72px) rotate(18deg) scale(.72); filter: blur(8px); } 72% { opacity:1; transform: translate(-12px,-8px) rotate(-3deg) scale(1.05); filter: blur(0); } 100% { opacity:1; transform: translate(0,0) rotate(0) scale(1); filter: blur(0); } }
      @keyframes ms-node-pulse { 0%,100% { opacity:.72; transform: scale(1); } 50% { opacity:1; transform: scale(1.18); } }
      @keyframes ms-sweep { 0% { opacity:0; stroke-dashoffset:900; } 20% { opacity:1; } 100% { opacity:.92; stroke-dashoffset:0; } }
      @keyframes ms-flare { 0%,70%,100% { opacity:0; transform: scale(.7); } 12% { opacity:1; transform: scale(1.12); } }

      @media (prefers-reduced-motion: reduce) {
        #ms-orb, #ms-outer-rings, #ms-nodes, #ms-trails, .ms-draw, .ms-node, #ms-monogram, #ms-feather-main, #ms-bottom-feather, #ms-light-sweep, #ms-assistant-flare {
          animation: none !important;
          opacity: 1 !important;
          stroke-dashoffset: 0 !important;
          transform: none !important;
          clip-path: none !important;
        }
      }
    </style>
  </defs>

  <!-- Transparent canvas: no background rect. -->

  <g id="ms-trails" filter="url(#msGoldGlow)" opacity="0.86">
    <path class="ms-draw delay-1" d="M-20 770 C210 600 380 685 584 504 C758 349 830 230 1080 130" fill="none" stroke="url(#msGoldSoft)" stroke-width="5" stroke-linecap="round" opacity="0.62"/>
    <path class="ms-draw delay-2" d="M-10 214 C236 130 440 178 620 348 C780 500 872 670 1060 690" fill="none" stroke="url(#msGoldSoft)" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
    <path class="ms-draw delay-3" d="M80 988 C240 794 390 768 552 622 C744 448 846 310 1014 294" fill="none" stroke="url(#msGoldSoft)" stroke-width="2.4" stroke-linecap="round" opacity="0.48"/>
  </g>

  <g id="ms-orb">
    <circle cx="512" cy="512" r="334" fill="url(#msCoreGlow)" filter="url(#msSoftBlur)" opacity="0.72"/>
    <circle cx="512" cy="512" r="262" fill="url(#msBlackCore)" filter="url(#msShadow)"/>

    <g id="ms-outer-rings" fill="none" filter="url(#msGoldGlow)">
      <circle class="ms-draw" cx="512" cy="512" r="302" stroke="rgba(216,174,79,.62)" stroke-width="2"/>
      <circle class="ms-draw delay-1" cx="512" cy="512" r="274" stroke="rgba(255,242,184,.42)" stroke-width="1.35"/>
      <circle class="ms-draw delay-2" cx="512" cy="512" r="236" stroke="rgba(216,174,79,.46)" stroke-width="1.2"/>
      <ellipse class="ms-draw delay-2" cx="512" cy="512" rx="370" ry="112" transform="rotate(-20 512 512)" stroke="rgba(245,207,114,.48)" stroke-width="1.8"/>
      <ellipse class="ms-draw delay-3" cx="512" cy="512" rx="346" ry="94" transform="rotate(24 512 512)" stroke="rgba(216,174,79,.42)" stroke-width="1.3"/>
      <ellipse class="ms-draw delay-3" cx="512" cy="512" rx="390" ry="124" transform="rotate(57 512 512)" stroke="rgba(255,242,184,.25)" stroke-width="1.1"/>
    </g>

    <circle cx="512" cy="512" r="214" fill="#050403" opacity="0.96"/>
    <circle cx="512" cy="512" r="215" fill="none" stroke="url(#msGold)" stroke-width="9" filter="url(#msGoldGlow)"/>
    <circle cx="512" cy="512" r="234" fill="none" stroke="rgba(216,174,79,.28)" stroke-width="2"/>

    <g id="ms-monogram" filter="url(#msGoldGlow)">
      <text x="286" y="632" font-family="Playfair Display, Georgia, serif" font-size="280" font-weight="500" fill="url(#msGold)" letter-spacing="-22">M</text>
    </g>

    <g id="ms-feather-main" filter="url(#msGoldGlow)">
      <path d="M508 666 C534 584 592 468 695 312 C624 374 556 466 502 574 C484 610 481 645 508 666Z" fill="url(#msGold)"/>
      <path d="M548 610 C600 524 646 432 703 318" fill="none" stroke="#130b02" stroke-width="11" stroke-linecap="round"/>
      <path d="M574 548 C636 536 676 498 716 444" fill="none" stroke="#130b02" stroke-width="6" stroke-linecap="round"/>
      <path d="M546 596 C598 586 640 550 682 496" fill="none" stroke="#130b02" stroke-width="5" stroke-linecap="round"/>
      <path d="M522 636 C566 624 600 592 634 548" fill="none" stroke="#130b02" stroke-width="5" stroke-linecap="round"/>
    </g>

    <g id="ms-bottom-feather" filter="url(#msGoldGlow)">
      <path d="M618 752 C708 718 798 664 916 570 C850 686 754 758 618 752Z" fill="url(#msGold)"/>
      <path d="M650 742 C740 696 820 636 904 578" fill="none" stroke="#1b0f03" stroke-width="7" stroke-linecap="round"/>
      <path d="M704 718 C744 716 792 694 836 646" fill="none" stroke="#1b0f03" stroke-width="5" stroke-linecap="round"/>
      <path d="M668 736 C712 730 754 706 798 666" fill="none" stroke="#1b0f03" stroke-width="5" stroke-linecap="round"/>
    </g>

    <g id="ms-nodes" filter="url(#msGoldGlow)">
      <g class="ms-node"><circle cx="512" cy="118" r="20" fill="#060403" stroke="url(#msGold)" stroke-width="5"/><circle cx="512" cy="118" r="7" fill="#fff2b8"/></g>
      <g class="ms-node"><circle cx="750" cy="206" r="18" fill="#060403" stroke="url(#msGold)" stroke-width="5"/><circle cx="750" cy="206" r="6" fill="#fff2b8"/></g>
      <g class="ms-node"><circle cx="852" cy="506" r="18" fill="#060403" stroke="url(#msGold)" stroke-width="5"/><circle cx="852" cy="506" r="6" fill="#fff2b8"/></g>
      <g class="ms-node"><circle cx="704" cy="790" r="17" fill="#060403" stroke="url(#msGold)" stroke-width="5"/><circle cx="704" cy="790" r="6" fill="#fff2b8"/></g>
      <g class="ms-node"><circle cx="330" cy="788" r="17" fill="#060403" stroke="url(#msGold)" stroke-width="5"/><circle cx="330" cy="788" r="6" fill="#fff2b8"/></g>
      <g class="ms-node"><circle cx="166" cy="500" r="18" fill="#060403" stroke="url(#msGold)" stroke-width="5"/><circle cx="166" cy="500" r="6" fill="#fff2b8"/></g>
      <g class="ms-node"><circle cx="270" cy="218" r="18" fill="#060403" stroke="url(#msGold)" stroke-width="5"/><circle cx="270" cy="218" r="6" fill="#fff2b8"/></g>
    </g>

    <path id="ms-light-sweep" d="M142 720 C308 514 514 354 850 238" fill="none" stroke="#fff2b8" stroke-width="5" stroke-linecap="round" filter="url(#msGoldGlow)"/>
    <circle id="ms-assistant-flare" cx="714" cy="316" r="38" fill="url(#coreGold)" filter="url(#msGoldGlow)"/>
  </g>
</svg>
