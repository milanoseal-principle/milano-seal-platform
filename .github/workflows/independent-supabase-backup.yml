name: Independent encrypted Supabase backup
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: milano-seal-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_PROJECT_REF: ehqdzfopsrbwewtddiwq
      SUPABASE_DB_URL: ${{ secrets.BACKUP_SUPABASE_DB_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.BACKUP_SUPABASE_SERVICE_ROLE_KEY }}
      BACKUP_GPG_PASSPHRASE: ${{ secrets.BACKUP_GPG_PASSPHRASE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - name: Offline backup integrity regressions
        run: python3 scripts/backups/test_backups.py -v
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Install PostgreSQL and S3 tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client awscli gnupg
      - name: Export database and actual private Storage objects
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in SUPABASE_DB_URL SUPABASE_SERVICE_ROLE_KEY BACKUP_GPG_PASSPHRASE AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY BACKUP_S3_BUCKET BACKUP_S3_ENDPOINT; do
            test -n "${!name:-}" || { echo "::error::Missing required secret: $name"; exit 1; }
          done
          umask 077
          mkdir -p "$RUNNER_TEMP/milano-backup/database" "$RUNNER_TEMP/milano-backup/storage"
          supabase db dump --db-url "$SUPABASE_DB_URL" -f "$RUNNER_TEMP/milano-backup/database/roles.sql" --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f "$RUNNER_TEMP/milano-backup/database/schema.sql"
          supabase db dump --db-url "$SUPABASE_DB_URL" -f "$RUNNER_TEMP/milano-backup/database/data.sql" --use-copy --data-only
          # The standard Supabase CLI dump excludes managed auth/storage schemas.
          # Capture auth records and Storage metadata independently and fail closed on errors.
          docker run --rm -e SUPABASE_DB_URL -v "$RUNNER_TEMP/milano-backup/database:/backup" postgres:17 sh -ec 'pg_dump "$SUPABASE_DB_URL" --format=custom --data-only --no-owner --no-acl --schema=auth --schema=storage --file=/backup/auth-storage-data.dump'
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At -F $'\t' -c "select bucket_id, count(*) from storage.objects group by bucket_id order by bucket_id" > "$RUNNER_TEMP/milano-backup/database/storage-object-counts.tsv"
          python3 scripts/backups/export_storage.py "$RUNNER_TEMP/milano-backup/storage" "$RUNNER_TEMP/milano-backup/database/storage-object-counts.tsv"
          python3 scripts/backups/verify_backup.py "$RUNNER_TEMP/milano-backup"
      - name: Encrypt locally and upload off platform
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          KEY="milano-seal/${STAMP}/backup.tar.gpg"
          tar -C "$RUNNER_TEMP/milano-backup" -cf - . | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --symmetric --cipher-algo AES256 --output "$RUNNER_TEMP/backup.tar.gpg" 3<<<"$BACKUP_GPG_PASSPHRASE"
          test -s "$RUNNER_TEMP/backup.tar.gpg"
          sha256sum "$RUNNER_TEMP/backup.tar.gpg" | awk '{print $1}' > "$RUNNER_TEMP/backup.sha256"
          aws --endpoint-url "$BACKUP_S3_ENDPOINT" s3 cp "$RUNNER_TEMP/backup.tar.gpg" "s3://$BACKUP_S3_BUCKET/$KEY" --only-show-errors
          aws --endpoint-url "$BACKUP_S3_ENDPOINT" s3 cp "$RUNNER_TEMP/backup.sha256" "s3://$BACKUP_S3_BUCKET/milano-seal/$STAMP/backup.sha256" --only-show-errors
          aws --endpoint-url "$BACKUP_S3_ENDPOINT" s3api head-object --bucket "$BACKUP_S3_BUCKET" --key "$KEY" --query ContentLength --output text | awk '$1 > 0 { ok=1 } END { exit !ok }'
          # Read back the remote encrypted bytes and checksum; never trust HEAD alone.
          aws --endpoint-url "$BACKUP_S3_ENDPOINT" s3 cp "s3://$BACKUP_S3_BUCKET/$KEY" "$RUNNER_TEMP/remote-backup.tar.gpg" --only-show-errors
          aws --endpoint-url "$BACKUP_S3_ENDPOINT" s3 cp "s3://$BACKUP_S3_BUCKET/milano-seal/$STAMP/backup.sha256" "$RUNNER_TEMP/remote-backup.sha256" --only-show-errors
          test "$(sha256sum "$RUNNER_TEMP/remote-backup.tar.gpg" | awk '{print $1}')" = "$(cat "$RUNNER_TEMP/remote-backup.sha256")"
          cmp "$RUNNER_TEMP/backup.sha256" "$RUNNER_TEMP/remote-backup.sha256"
          echo "Backup encrypted, uploaded, and remote ciphertext verified: $STAMP (restore certification still pending)"
      - name: Always remove temporary sensitive files
        if: always()
        run: rm -rf "$RUNNER_TEMP/milano-backup" "$RUNNER_TEMP/backup.tar.gpg" "$RUNNER_TEMP/backup.sha256" "$RUNNER_TEMP/remote-backup.tar.gpg" "$RUNNER_TEMP/remote-backup.sha256"
