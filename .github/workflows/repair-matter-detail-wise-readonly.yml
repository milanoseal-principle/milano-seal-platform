name: Surgical Matter Detail Wise Read-Only Repair

on:
  push:
    branches:
      - fix/restore-matter-detail-wise-readonly

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/restore-matter-detail-wise-readonly
          fetch-depth: 0

      - name: Apply deterministic repair
        run: python scripts/repair-matter-detail-wise-readonly.py

      - name: Verify surgical diff
        run: |
          git diff --check
          git diff --stat

      - name: Commit repaired Matter detail page
        run: |
          if git diff --quiet; then
            echo "No repair changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/dashboard/deals/'[id]'/page.tsx
          git commit -m "Restore Matter detail UX with Wise read-only settlement"
          git push origin HEAD:fix/restore-matter-detail-wise-readonly
