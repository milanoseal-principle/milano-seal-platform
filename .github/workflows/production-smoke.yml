name: Milano Seal Production Smoke Test

on:
  workflow_dispatch:
    inputs:
      production_url:
        description: "Production URL to test, e.g. https://themilanoseal.com"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production target
        env:
          BASE_URL: ${{ inputs.production_url }}
        run: |
          set -euo pipefail
          case "$BASE_URL" in
            https://*) ;;
            *)
              echo "Production URL must use https://"
              exit 1
              ;;
          esac

      - name: Typecheck
        run: npm run typecheck

      - name: Diff check
        run: git diff --check

      - name: Canonical transaction validators
        run: |
          set -euo pipefail
          node scripts/validate-global-pricing-courier.mjs
          node scripts/validate-wise-only-active-ops-docs.mjs
          node scripts/validate-immediate-scheduling-after-wise-submission.mjs
          node scripts/validate-wise-reconciliation-exception-orchestrator.mjs
          node scripts/validate-matter-execution-corridor-spine.mjs
          node scripts/validate-production-transaction-10of10.mjs
          node scripts/validate-postpayment-ron-matter-progression.mjs
          npm run validate:migration-chain

      - name: Targeted transaction tests
        run: |
          set -euo pipefail
          node --import tsx --test \
            tests/global-pricing-courier-p0.test.ts \
            tests/production-transaction-10of10.test.ts \
            tests/postpayment-ron-matter-progression-p0.test.ts

      - name: Build
        run: npm run build

      - name: Verify canonical production files exist
        run: |
          set -euo pipefail
          REQUIRED=(
            "app/login/page.tsx"
            "app/intake/page.tsx"
            "app/map/page.tsx"
            "app/countries/page.tsx"
            "app/notary/join/page.tsx"
            "app/professional/damiani/page.tsx"
            "app/professional/damiani/DamianiReentry.tsx"
            "app/documents/[document]/[country]/page.tsx"
            "app/today/page.tsx"
            "app/workspace/release/page.tsx"
            "app/dashboard/page.tsx"
            "app/dashboard/deliveries/page.tsx"
            "app/dashboard/discounts/page.tsx"
            "app/dashboard/incidents/page.tsx"
            "app/dashboard/notary-network/page.tsx"
            "app/dashboard/truth/page.tsx"
            "app/dashboard/workbook/page.tsx"
            "app/dashboard/workbook/[sheet]/page.tsx"
            "app/portal/page.tsx"
            "app/portal/tracking/page.tsx"
            "app/portal/trackingNow/page.tsx"
            "app/portal/invoice/page.tsx"
            "app/portal/documents/page.tsx"
            "app/portal/payment/page.tsx"
            "app/portal/release/page.tsx"
            "app/portal/ron/page.tsx"
            "app/alliance/dashboard/page.tsx"
            "app/va/dashboard/page.tsx"
            "app/va/portal/page.tsx"
            "app/api/auth/login/route.ts"
            "app/api/dashboard/discounts/route.ts"
            "app/api/dashboard/incidents/route.ts"
            "app/api/notary/apply/route.ts"
            "app/api/notary/credentials/route.ts"
            "app/api/health/route.ts"
            "app/api/dashboard/shippo/health/route.ts"
            "app/api/dashboard/shippo/rates/route.ts"
            "app/api/dashboard/shippo/labels/route.ts"
            "app/api/courier/webhook/route.ts"
            "app/api/deals/[id]/pay/route.ts"
            "app/api/deals/[id]/schedule/route.ts"
            "app/api/deals/[id]/execute/route.ts"
            "app/api/deals/[id]/apostille/route.ts"
            "app/api/dashboard/ron/sessions/route.ts"
            "app/api/dashboard/ron/sessions/[id]/advance-to-apostille/route.ts"
            "app/api/webhooks/bluenotary/route.ts"
            "components/ron/RONSessionControlPanel.tsx"
            "lib/bluenotary/guards.ts"
            "lib/release/performFinalRelease.ts"
            "lib/auth/server-role.ts"
            "lib/dashboardAuth.ts"
            "lib/seo-document-routing.ts"
            "supabase/migrations/079_wise_observed_scheduling_gate.sql"
          )
          FAIL=0
          for f in "${REQUIRED[@]}"; do
            if [ -f "$f" ]; then
              echo "✅ $f"
            else
              echo "❌ MISSING $f"
              FAIL=1
            fi
          done
          if [ "$FAIL" -eq 1 ]; then
            echo "One or more required production files are missing."
            exit 1
          fi

      - name: Route and runtime smoke test
        env:
          BASE_URL: ${{ inputs.production_url }}
        run: |
          set -euo pipefail
          BASE_URL="${BASE_URL%/}"
          PASS=0
          FAIL=0

          check_public() {
            local route="$1"
            local url="${BASE_URL}${route}"
            local status
            status=$(curl --retry 2 --retry-delay 2 -L -sS -o /tmp/page.html -w "%{http_code}" "$url")
            local final_url
            final_url=$(curl --retry 2 --retry-delay 2 -LsS -o /dev/null -w "%{url_effective}" "$url")

            if [ "$status" -ge 500 ]; then
              echo "❌ FAIL [public] $route → $status (final: $final_url)"
              FAIL=$((FAIL+1))
              return
            fi
            if grep -qi "404: This page could not be found\|Page Not Found\|NOT_FOUND" /tmp/page.html; then
              echo "❌ FAIL [public] $route → 404 content (status: $status)"
              FAIL=$((FAIL+1))
              return
            fi
            if [ "$status" -ge 400 ]; then
              echo "❌ FAIL [public] $route → $status (expected < 400)"
              FAIL=$((FAIL+1))
              return
            fi
            echo "✅ PASS [public] $route → $status (final: $final_url)"
            PASS=$((PASS+1))
          }

          check_protected() {
            local route="$1"
            local url="${BASE_URL}${route}"
            local status
            status=$(curl --retry 2 --retry-delay 2 -sS -o /tmp/page.html -w "%{http_code}" "$url")
            local final_url
            final_url=$(curl --retry 2 --retry-delay 2 -LsS -o /dev/null -w "%{url_effective}" "$url")

            if [ "$status" -ge 500 ]; then
              echo "❌ FAIL [protected] $route → $status"
              FAIL=$((FAIL+1))
              return
            fi
            if grep -qi "404: This page could not be found\|Page Not Found\|NOT_FOUND" /tmp/page.html; then
              echo "❌ FAIL [protected] $route → 404 content (status: $status)"
              FAIL=$((FAIL+1))
              return
            fi
            echo "✅ PASS [protected] $route → $status (final: $final_url)"
            PASS=$((PASS+1))
          }

          check_protected_api() {
            local route="$1"
            local url="${BASE_URL}${route}"
            local status
            status=$(curl --retry 2 --retry-delay 2 -sS -o /tmp/api.json -w "%{http_code}" "$url")

            if [ "$status" -ge 500 ]; then
              echo "❌ FAIL [api:protected] $route → $status"
              FAIL=$((FAIL+1))
              return
            fi
            if [ "$status" -eq 404 ]; then
              echo "❌ FAIL [api:protected] $route → 404 (route missing)"
              FAIL=$((FAIL+1))
              return
            fi
            if [ "$status" -eq 401 ] || [ "$status" -eq 403 ] || [ "$status" -eq 200 ]; then
              echo "✅ PASS [api:protected] $route → $status"
              PASS=$((PASS+1))
              return
            fi
            echo "⚠️ WARN [api:protected] $route → $status (route exists, unexpected method/status)"
            PASS=$((PASS+1))
          }

          check_health() {
            local url="${BASE_URL}/api/health"
            local status
            status=$(curl --retry 2 --retry-delay 2 -sS -o /tmp/health.json -w "%{http_code}" "$url")
            if [ "$status" -ne 200 ]; then
              echo "❌ FAIL [health] /api/health → $status"
              FAIL=$((FAIL+1))
              return
            fi

            if ! node -e '
              const fs = require("fs");
              const h = JSON.parse(fs.readFileSync("/tmp/health.json", "utf8"));
              if (h.status !== "ok") process.exit(1);
              if (h.service !== "milano-seal-platform") process.exit(1);
              if (h.environment !== "production") process.exit(1);
              if (h?.env?.supabase_anon_key !== "SET") process.exit(1);
              if (h?.env?.supabase_service_role_key !== "SET") process.exit(1);
              if (h?.supabase?.reachable !== true) process.exit(1);
            '; then
              echo "❌ FAIL [health] invalid production/Supabase health payload"
              cat /tmp/health.json
              FAIL=$((FAIL+1))
              return
            fi

            echo "✅ PASS [health] production runtime + Supabase reachable"
            PASS=$((PASS+1))
          }

          echo ""
          echo "══════════════════════════════════════════════"
          echo " PUBLIC ROUTES"
          echo "══════════════════════════════════════════════"
          check_public "/"
          check_public "/login"
          check_public "/login?error=access_denied"
          check_public "/login?next=/portal"
          check_public "/login?next=/dashboard"
          check_public "/intake"
          check_public "/map"
          check_public "/countries"
          check_public "/notary/join"
          check_public "/professional/damiani"
          check_public "/documents/fbi-background-check/france"
          check_public "/documents/birth-certificate/italy"
          check_public "/documents/power-of-attorney/spain"

          echo ""
          echo "══════════════════════════════════════════════"
          echo " OPERATOR / RELEASE ROUTES"
          echo "══════════════════════════════════════════════"
          check_protected "/today"
          check_protected "/workspace/release"
          check_protected "/dashboard"
          check_protected "/dashboard/deliveries"
          check_protected "/dashboard/discounts"
          check_protected "/dashboard/incidents"
          check_protected "/dashboard/notary-network"
          check_protected "/dashboard/truth"
          check_protected "/dashboard/workbook"
          check_protected "/dashboard/workbook/START_HERE"

          echo ""
          echo "══════════════════════════════════════════════"
          echo " CLIENT PORTAL ROUTES"
          echo "══════════════════════════════════════════════"
          check_protected "/portal"
          check_protected "/portal/tracking"
          check_protected "/portal/trackingNow"
          check_protected "/portal/invoice"
          check_protected "/portal/documents"
          check_protected "/portal/payment"
          check_protected "/portal/release"
          check_protected "/portal/ron"

          echo ""
          echo "══════════════════════════════════════════════"
          echo " ROLE-ISOLATED ROUTES"
          echo "══════════════════════════════════════════════"
          check_protected "/alliance/dashboard"
          check_protected "/va/dashboard"
          check_protected "/va/portal"

          echo ""
          echo "══════════════════════════════════════════════"
          echo " PROTECTED API ROUTES"
          echo "══════════════════════════════════════════════"
          check_protected_api "/api/dashboard/discounts"
          check_protected_api "/api/dashboard/incidents"
          check_protected_api "/api/notary/credentials"
          check_protected_api "/api/dashboard/shippo/health"
          check_protected_api "/api/webhooks/bluenotary"

          echo ""
          echo "══════════════════════════════════════════════"
          echo " PRODUCTION HEALTH"
          echo "══════════════════════════════════════════════"
          check_health

          echo ""
          echo "══════════════════════════════════════════════"
          echo " SUMMARY"
          echo "══════════════════════════════════════════════"
          echo "PASS: $PASS"
          echo "FAIL: $FAIL"
          echo ""

          if [ "$FAIL" -gt 0 ]; then
            echo "Smoke test FAILED — $FAIL production check(s) need attention."
            exit 1
          fi

          echo "All automated production smoke checks PASSED."
          echo "This proves the non-destructive code/runtime corridor only; live BlueNotary transaction certification still requires the controlled Tiffany Matter."
