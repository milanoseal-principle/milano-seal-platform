name: Repair npm lock for Damiani activation

on:
  push:
    branches:
      - agent/damiani-final-production-activation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-npm-lock-damiani
  cancel-in-progress: false

jobs:
  repair-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout activation branch
        uses: actions/checkout@v4
        with:
          ref: agent/damiani-final-production-activation
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate npm lock from canonical package.json
        run: |
          npm install --package-lock-only --ignore-scripts

      - name: Assert Stripe is absent from active npm dependency graph
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const active = {
            ...(pkg.dependencies || {}),
            ...(pkg.devDependencies || {}),
            ...(pkg.optionalDependencies || {}),
            ...(pkg.peerDependencies || {}),
          };
          if (Object.prototype.hasOwnProperty.call(active, 'stripe')) {
            throw new Error('package.json still declares Stripe');
          }
          const root = lock.packages?.['']?.dependencies || {};
          if (Object.prototype.hasOwnProperty.call(root, 'stripe')) {
            throw new Error('package-lock root still declares Stripe');
          }
          if (lock.packages && Object.prototype.hasOwnProperty.call(lock.packages, 'node_modules/stripe')) {
            throw new Error('package-lock still contains node_modules/stripe');
          }
          console.log('PASS: Stripe absent from package.json and package-lock.json');
          NODE

      - name: Commit repaired lockfile only when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already canonical"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Remove stale Stripe entries from npm lockfile"
          git push origin HEAD:agent/damiani-final-production-activation
