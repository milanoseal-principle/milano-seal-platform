name: Apply Smart Intake Pricing Integrity

on:
  push:
    branches:
      - agent/intake-pricing-courtesy-integrity

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/intake-pricing-courtesy-integrity
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply integrity patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"marker not found in {path}: {old[:120]!r}")
              p.write_text(s.replace(old, new, 1))

          # 1) Confidence = core structure only. Timeline/delivery are review selections,
          # not missing extraction facts, so never show a fake 83% confidence penalty.
          p = Path('lib/intake/matterAnalysis.ts')
          s = p.read_text()
          s = s.replace('  { key: "urgency", label: "Timeline" },\n', '')
          s = s.replace('  if (a.urgency === "standard") missing.push("Preferred execution timeline");\n', '')
          s = s.replace('  if (a.urgency && a.urgency !== "standard") hits++;\n', '')
          p.write_text(s)

          # 2) Canonical pricing engine must honor explicit zero counts.
          replace(
              'lib/pricing.ts',
              '''function toInt(value: unknown, fallback = 0): number {\n  const parsed = parseInt(String(value ?? ""), 10);\n  return Number.isFinite(parsed) && parsed > 0 ? parsed : fallback;\n}\n''',
              '''function toInt(value: unknown, fallback = 0): number {\n  const parsed = parseInt(String(value ?? ""), 10);\n  return Number.isFinite(parsed) && parsed > 0 ? parsed : fallback;\n}\n\nfunction toNonNegativeInt(value: unknown, fallback = 0): number {\n  if (value === null || value === undefined || value === "") return fallback;\n  const parsed = parseInt(String(value), 10);\n  return Number.isFinite(parsed) && parsed >= 0 ? parsed : fallback;\n}\n'''
          )
          replace(
              'lib/pricing.ts',
              '''  const notarizedSigCount = Math.max(\n    0,\n    toInt(\n      params.notarized_signature_count ??\n        params.signature_count ??\n        params.signatureCount,\n      signerCount,\n    ),\n  );\n  const intlSignerCount = Math.max(\n    0,\n    toInt(\n      params.international_signer_count ?? params.internationalSignerCount,\n      0,\n    ),\n  );\n''',
              '''  const notarizedSigCount = Math.max(\n    0,\n    toNonNegativeInt(\n      params.notarized_signature_count ??\n        params.signature_count ??\n        params.signatureCount,\n      0,\n    ),\n  );\n  const intlSignerCount = Math.max(\n    0,\n    toNonNegativeInt(\n      params.international_signer_count ?? params.internationalSignerCount,\n      0,\n    ),\n  );\n'''
          )
          replace(
              'lib/pricing.ts',
              '''  const apostilleCount = Math.max(\n    0,\n    toInt(\n      params.apostille_count ?? params.apostilleCount,\n      toBool(params.apostille_required) ? 1 : 0,\n    ),\n  );\n''',
              '''  const apostilleCount = Math.max(\n    0,\n    toNonNegativeInt(\n      params.apostille_count ?? params.apostilleCount,\n      toBool(params.apostille_required) ? 1 : 0,\n    ),\n  );\n'''
          )

          # 3) Smart Intake pricing projection delegates to controlling engine.
          replace(
              'lib/pricing/milanoPricingTruth.ts',
              '''import { INTERNAL_BASES } from "./pricingDoctrine";\nimport type { SmartIntakeClassification, ServiceState } from "../intake/smartClassification";\n''',
              '''import { INTERNAL_BASES } from "./pricingDoctrine";\nimport { calculatePrice } from "../pricing";\nimport type { SmartIntakeClassification, ServiceState } from "../intake/smartClassification";\n'''
          )
          replace(
              'lib/pricing/milanoPricingTruth.ts',
              '''  authorizedAddOns: { apostille?: number; rush?: number; additionalSigners?: number };\n''',
              '''  authorizedAddOns: { apostille?: number; rush?: number; additionalSigners?: number };\n  /** Client-safe itemization. Hidden operational components are rolled into the lane line, never exposed separately. */\n  clientLineItems: Array<{ key: string; label: string; amount: number }>;\n'''
          )
          replace(
              'lib/pricing/milanoPricingTruth.ts',
              '''    authorizedAddOns: {},\n    additionalSignerCount: 0,\n''',
              '''    authorizedAddOns: {},\n    clientLineItems: [],\n    additionalSignerCount: 0,\n'''
          )

          p = Path('lib/pricing/milanoPricingTruth.ts')
          s = p.read_text()
          start = s.index('  const lane = input.selectedLane ?? "signature";')
          end_marker = '  return {\n    commercialContext: ctx,\n    suggestedLane: lane,'
          end = s.index(end_marker, start)
          prefix = s[:start]
          suffix = s[end:]
          new_block = '''  // Resolve the same minimum lane used by the server before calculating money.\n  // A selected lane may elevate scope, but never downgrade an apostille / multi-signer / urgent matter.\n  const requestedLane = input.selectedLane ?? "signature";\n  const minimumLane: "signature" | "priority" | "executive" =\n    c.urgency === "urgent" || c.urgency === "same_day"\n      ? "executive"\n      : isRequired(c.apostille) || c.signerCount > 1\n        ? "priority"\n        : "signature";\n  const laneRank = { signature: 0, priority: 1, executive: 2 } as const;\n  const lane = laneRank[requestedLane] >= laneRank[minimumLane] ? requestedLane : minimumLane;\n\n  // ONE pricing engine: lib/pricing.ts calculatePrice. No second arithmetic path.\n  const canonical = calculatePrice({\n    tier: lane,\n    document_count: Math.max(1, c.documentCount || 1),\n    signer_count: Math.max(1, c.signerCount || 1),\n    notarized_signature_count:\n      isRequired(c.notarization) || isRequired(c.ron) ? Math.max(1, c.signerCount || 1) : 0,\n    apostille_count: isRequired(c.apostille) ? Math.max(1, c.apostilleQuantity || 1) : 0,\n    urgency:\n      c.urgency === "same_day" ? "same_day" :\n      c.urgency === "urgent" ? "rush" :\n      c.urgency === "expedited" ? "expedited" : "standard",\n    shipping: "none",\n  });\n\n  const hiddenOperational = canonical.breakdown\n    .filter((item) => item.internal_only)\n    .reduce((sum, item) => sum + item.amount, 0);\n  const publicItems = canonical.breakdown.filter((item) => !item.internal_only);\n  const laneName = lane[0].toUpperCase() + lane.slice(1);\n  const clientLineItems = publicItems.map((item) =>\n    item.key === "base"\n      ? { key: item.key, label: `${laneName} Execution Lane`, amount: item.amount + hiddenOperational }\n      : { key: item.key, label: item.label, amount: item.amount },\n  );\n\n  const addOns: MilanoPricingResult["authorizedAddOns"] = {};\n  const apostilleItem = canonical.breakdown.find((item) => item.key === "apostille");\n  const urgencyItem = canonical.breakdown.find((item) => item.key === "urgency");\n  const signerItem = canonical.breakdown.find((item) => item.key === "additional_signers");\n  if (apostilleItem) addOns.apostille = apostilleItem.amount;\n  if (urgencyItem) addOns.rush = urgencyItem.amount;\n  if (signerItem) addOns.additionalSigners = signerItem.amount;\n\n  const additionalSignerCount = Math.max(0, c.signerCount - 1);\n  const total = canonical.total;\n  const parts = [`${laneName} Execution`];\n  if (apostilleItem) parts.push("Apostille Coordination");\n  if (urgencyItem) parts.push("Timeline Premium");\n  if (signerItem) parts.push(`${additionalSignerCount} Additional Signer${additionalSignerCount > 1 ? "s" : ""}`);\n\n'''
          s = prefix + new_block + suffix
          # canonical base + safe itemization in return
          s = s.replace('''    laneBase,\n    authorizedAddOns: addOns,\n''', '''    laneBase: canonical.base,\n    authorizedAddOns: addOns,\n    clientLineItems,\n''', 1)
          p.write_text(s)

          # 4) Unknown execution facts block quote readiness before checkout.
          replace(
              'lib/intake/reviewReadiness.ts',
              '''  if (!(c.destinationCountry && c.destinationCountry.trim())) {\n    out.push("Destination country");\n  }\n\n  if (!timeline) out.push("Preferred execution timeline");\n''',
              '''  if (!(c.destinationCountry && c.destinationCountry.trim())) {\n    out.push("Destination country");\n  }\n\n  if (c.notarization === "unknown") {\n    out.push("Notarization requirement");\n  } else if (c.notarization === "required" && c.ron === "unknown" && c.mobile === "unknown") {\n    out.push("Execution method (remote or in-person)");\n  }\n\n  if (!timeline) out.push("Preferred execution timeline");\n'''
          )

          # 5) Wizard sends canonical pricing facts and renders client-safe itemization.
          replace(
              'components/intake/smart-intake-sop-wizard.tsx',
              '''      source_channel: "Website Form",\n      name: form.name,\n''',
              '''      source_channel: "Website Form",\n      tier: initialTier,\n      client_quoted_total: clientPricing.mode === "approved_price" ? clientPricing.amount : undefined,\n      pricing_engine_version: "canonical-pricing-v1",\n      name: form.name,\n'''
          )
          replace(
              'components/intake/smart-intake-sop-wizard.tsx',
              '''      mobile: classification.mobile === "required",\n      apostille: classification.apostille === "required",\n''',
              '''      mobile: classification.mobile === "required",\n      notarization_required: classification.notarization === "required",\n      ron_required: classification.ron === "required",\n      apostille: classification.apostille === "required",\n'''
          )
          replace(
              'components/intake/smart-intake-sop-wizard.tsx',
              '''                  <div className="mt-5 flex items-baseline justify-between border-t border-[rgba(198,165,90,0.14)] pt-4">\n                    <span className="text-[11px] font-semibold uppercase tracking-[0.16em] text-[#9A9488]">Quoted Investment</span>\n                    <span className="text-2xl font-semibold text-white">{new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", minimumFractionDigits: 2 }).format(clientPricing.amount ?? 0)}</span>\n                  </div>\n                  <p className="mt-3 text-[11px] font-light text-[#9A9488]">Wise secure payment · Scheduling available only after verified payment. Final pricing is confirmed after review.</p>\n''',
              '''                  <div className="mt-5 border-t border-[rgba(198,165,90,0.14)] pt-4">\n                    <div className="mb-2 text-[9px] font-semibold uppercase tracking-[0.18em] text-[#9A9488]">Quote Breakdown</div>\n                    <div className="space-y-2">\n                      {pricing.clientLineItems.map((item) => (\n                        <div key={item.key} className="flex items-start justify-between gap-4 text-[12px] font-light text-[#E8DCC0]">\n                          <span>{item.label}</span>\n                          <span className="shrink-0">{new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", minimumFractionDigits: 2 }).format(item.amount)}</span>\n                        </div>\n                      ))}\n                    </div>\n                  </div>\n                  {courtesyCode && (\n                    <div className="mt-4 flex items-start justify-between gap-4 border-t border-[rgba(198,165,90,0.14)] pt-4 text-[12px]">\n                      <span className="text-[#D8C08A]">Courtesy code</span>\n                      <span className="font-semibold text-[var(--ms-gold)]">{courtesyCode} · validated securely at checkout</span>\n                    </div>\n                  )}\n                  <div className="mt-5 flex items-baseline justify-between border-t border-[rgba(198,165,90,0.14)] pt-4">\n                    <span className="text-[11px] font-semibold uppercase tracking-[0.16em] text-[#9A9488]">Quoted Investment</span>\n                    <span className="text-2xl font-semibold text-white">{new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", minimumFractionDigits: 2 }).format(clientPricing.amount ?? 0)}</span>\n                  </div>\n                  <p className="mt-3 text-[11px] font-light text-[#9A9488]">Wise secure payment · Courtesy adjustments are validated server-side before payment instructions are issued · Scheduling available only after verified payment.</p>\n'''
          )

          # 6) Server uses the same canonical engine and no longer requires the optional deals.discount_type column.
          replace(
              'app/api/intake/route.ts',
              'import { determineLaneAndPrice } from "@/lib/pricing";\n',
              'import { calculatePrice, determineLaneAndPrice } from "@/lib/pricing";\n'
          )
          replace(
              'app/api/intake/route.ts',
              '''    const pricing = determineLaneAndPrice(pricingInput);\n    const supabase = createAdminClient();\n''',
              '''    const legacyPricing = determineLaneAndPrice(pricingInput);\n    const requestedTierRaw = String(raw.tier ?? "").toLowerCase();\n    const requestedLane: "Signature" | "Priority" | "Executive" =\n      requestedTierRaw === "executive" ? "Executive" :\n      requestedTierRaw === "signature" ? "Signature" :\n      requestedTierRaw === "priority" ? "Priority" : autoLane;\n    const laneOrder = ["Signature", "Priority", "Executive"] as const;\n    const pricedLane =\n      laneOrder.indexOf(requestedLane) >= laneOrder.indexOf(autoLane) ? requestedLane : autoLane;\n    const canonicalPricing = calculatePrice({\n      tier: pricedLane.toLowerCase(),\n      document_count: Math.max(1, Number(data.docs ?? raw.docs ?? 1)),\n      signer_count: Math.max(1, Number(data.signers ?? raw.signers ?? 1)),\n      notarized_signature_count:\n        raw.notarization_required === true || raw.ron_required === true\n          ? Math.max(1, Number(data.signers ?? raw.signers ?? 1))\n          : 0,\n      apostille_count:\n        Boolean(compliance?.apostille_required ?? data.apostille)\n          ? Math.max(1, Number(raw.apostille_count ?? 1))\n          : 0,\n      urgency: data.urgency ?? "standard",\n      shipping: "none",\n    });\n    const pricing = {\n      lane: pricedLane,\n      base: canonicalPricing.base,\n      total: canonicalPricing.total,\n      addons: canonicalPricing.breakdown\n        .filter((item) => !item.internal_only && item.key !== "base")\n        .map((item) => ({ item: item.label, amount: item.amount })),\n      witness_total: legacyPricing.witness_total,\n    };\n\n    const clientQuotedTotal = Number(raw.client_quoted_total);\n    if (Number.isFinite(clientQuotedTotal) && Math.abs(clientQuotedTotal - pricing.total) > 0.009) {\n      return NextResponse.json(\n        {\n          error: "Pricing changed after server validation. Please review the updated matter scope before payment.",\n          code: "PRICING_REVIEW_REQUIRED",\n          quoted_total: clientQuotedTotal,\n          authoritative_total: pricing.total,\n        },\n        { status: 409 },\n      );\n    }\n\n    const supabase = createAdminClient();\n'''
          )
          # Remove duplicate laneOrder declaration later; pricedLane is already authoritative.
          replace(
              'app/api/intake/route.ts',
              '''    const laneOrder = ["Signature", "Priority", "Executive"];\n    const finalLane =\n      laneOrder.indexOf(autoLane) > laneOrder.indexOf(pricing.lane)\n        ? autoLane\n        : pricing.lane;\n''',
              '''    const finalLane = pricing.lane;\n'''
          )
          replace(
              'app/api/intake/route.ts',
              '''      discount_code: courtesyAdjustment?.code ?? null,\n      discount_type: courtesyAdjustment?.discount_type ?? null,\n      discount_value: courtesyAdjustment?.discount_value ?? null,\n''',
              '''      discount_code: courtesyAdjustment?.code ?? null,\n      // discount_type is intentionally kept in intake metadata, not required as a deals column.\n      // Atomic redemption only requires code + eligible subtotal + discount amount.\n      discount_value: courtesyAdjustment?.discount_value ?? null,\n'''
          )

          # 7) Regression tests: exact $1,450 canonical quote and no fake timeline confidence penalty.
          Path('tests/unit/intakePricingIntegrity.test.ts').write_text(r'''import { test } from "node:test";
          import assert from "node:assert/strict";
          import { priceSmartIntake } from "@/lib/pricing/milanoPricingTruth";
          import { calculatePrice } from "@/lib/pricing";
          import { mergeAnalysis, emptyAnalysis } from "@/lib/intake/matterAnalysis";
          import type { SmartIntakeClassification } from "@/lib/intake/smartClassification";

          const classification: SmartIntakeClassification = {
            documentType: "One and the Same Affidavit",
            documentCount: 2,
            originJurisdiction: "Florida",
            destinationCountry: "Colombia",
            signerCount: 1,
            notarization: "not_required",
            ron: "not_required",
            apostille: "required",
            apostilleQuantity: 2,
            authentication: "unknown",
            translation: "not_required",
            witness: "unknown",
            mobile: "unknown",
            courier: "unknown",
            shipping: "unknown",
            urgency: "normal",
            explicitNegatives: ["ron", "translation"],
            contradictions: [],
            missingCriticalFacts: [],
            manualReviewReasons: [],
            classificationConfidence: "high",
            routingConfidence: "high",
          } as SmartIntakeClassification;

          test("Smart Intake quote equals controlling pricing engine for 2 Colombia apostilles", () => {
            const smart = priceSmartIntake({ classification, selectedLane: "priority", commercialContext: "consumer" });
            const canonical = calculatePrice({
              tier: "priority",
              document_count: 2,
              signer_count: 1,
              notarized_signature_count: 0,
              apostille_count: 2,
              urgency: "standard",
              shipping: "none",
            });
            assert.equal(canonical.total, 1450);
            assert.equal(smart.total, canonical.total);
            assert.equal(smart.clientDisplay.mode, "approved_price");
            assert.equal(smart.clientLineItems.reduce((sum, item) => sum + item.amount, 0), canonical.total);
          });

          test("explicit zero notarized signatures does not add a hidden $25 charge", () => {
            const quote = calculatePrice({ tier: "priority", notarized_signature_count: 0, apostille_count: 0 });
            assert.equal(quote.breakdown.some((item) => item.key === "notarized_signatures"), false);
          });

          test("matter confidence scores core extracted facts, not later timeline preference", () => {
            const analysis = mergeAnalysis(emptyAnalysis(), {
              country: "Colombia",
              documentType: "One and the Same Affidavit",
              documentDescription: "Two affidavits for apostille",
              signerCount: 1,
              apostilleRequired: true,
              urgency: "standard",
            });
            assert.equal(analysis.confidenceScore, 100);
            assert.equal(analysis.missingFields.includes("Preferred execution timeline"), false);
          });
          '''.replace('          ', ''))

          # Remove this one-shot workflow from the resulting code commit.
          wf = Path('.github/workflows/apply-intake-pricing-integrity.yml')
          if wf.exists():
              wf.unlink()
          PY

      - name: Verify
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run build
          npm run validate:smart-intake-sop
          npm run validate:smart-intake-pricing-engine
          npm run validate:final-production-regression

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Smart Intake pricing, confidence, and courtesy checkout integrity"
          git push origin HEAD:agent/intake-pricing-courtesy-integrity
