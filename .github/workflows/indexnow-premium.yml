name: Milano Seal Premium IndexNow

on:
  workflow_dispatch:
    inputs:
      production_url:
        description: "Canonical production URL"
        required: true
        default: "https://www.themilanoseal.com"
        type: string

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify IndexNow key is live
        env:
          BASE_URL: ${{ inputs.production_url }}
        run: |
          set -e
          KEY="5410460e878b06ab791d376db5f50aca"
          VALUE=$(curl -fsSL "${BASE_URL%/}/${KEY}.txt")
          test "$VALUE" = "$KEY"
          echo "IndexNow key verified on production."

      - name: Submit premium corridor URLs
        env:
          INDEXNOW_BASE_URL: ${{ inputs.production_url }}
        run: node scripts/submit-indexnow-premium.mjs
