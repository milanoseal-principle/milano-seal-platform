name: Apply Smart Intake Pricing Integrity V2

on:
  push:
    branches:
      - agent/intake-pricing-courtesy-integrity

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/intake-pricing-courtesy-integrity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply corrected integrity patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def rep(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit(f'marker missing: {path}: {old[:100]!r}')
              p.write_text(s.replace(old,new,1))

          # A. First screenshot: confidence measures extracted structure only.
          p=Path('lib/intake/matterAnalysis.ts'); s=p.read_text()
          s=s.replace('  { key: "urgency", label: "Timeline" },\n','')
          s=s.replace('  if (a.urgency === "standard") missing.push("Preferred execution timeline");\n','')
          s=s.replace('  if (a.urgency && a.urgency !== "standard") hits++;\n','')
          p.write_text(s)

          old='''function ConfidencePanel({ analysis }: { analysis: MatterAnalysis }) {\n  return (\n    <div className="bg-[#111111] border border-[rgba(198,165,90,0.18)] rounded-sm p-5">\n      <div className="text-[10px] font-semibold tracking-[0.2em] uppercase text-[#C6A55A] mb-3">\n        Matter Structuring Confidence\n      </div>\n      <div className="font-serif text-[40px] text-[#F6F1E6] leading-none mb-4">\n        {analysis.confidenceScore}%\n      </div>\n      <div className="space-y-1.5 mb-3">\n        {analysis.detectedFields.map((f) => (\n          <div\n            key={f}\n            className="flex items-center gap-2 text-[12.5px] text-[#D9D1C4]"\n          >\n            <CheckCircle2\n              className="w-3 h-3 text-emerald-400 flex-shrink-0"\n              strokeWidth={2.4}\n            />\n            {f}\n          </div>\n        ))}\n      </div>\n      {analysis.missingFields.length > 0 && (\n        <div className="pt-3 border-t border-white/[0.08]">\n          <div className="text-[10.5px] uppercase tracking-[0.14em] text-[#9A9488] mb-1.5 font-semibold">\n            Missing\n          </div>\n          {analysis.missingFields.map((f) => (\n            <div\n              key={f}\n              className="text-[12px] text-[#9A9488] leading-relaxed font-light"\n            >\n              · {f}\n            </div>\n          ))}\n        </div>\n      )}\n    </div>\n  );\n}\n'''
          new='''function ConfidencePanel({ analysis }: { analysis: MatterAnalysis }) {\n  const complete = analysis.missingFields.length === 0;\n  return (\n    <div className="bg-[#111111] border border-[rgba(198,165,90,0.18)] rounded-sm p-5">\n      <div className="text-[10px] font-semibold tracking-[0.2em] uppercase text-[#C6A55A] mb-3">Matter Structure</div>\n      <div className="font-serif text-[24px] text-[#F6F1E6] leading-tight mb-4">\n        {complete ? "Core Matter Facts Captured" : "Additional Matter Facts Needed"}\n      </div>\n      <div className="space-y-1.5 mb-3">\n        {analysis.detectedFields.map((f) => (\n          <div key={f} className="flex items-center gap-2 text-[12.5px] text-[#D9D1C4]">\n            <CheckCircle2 className="w-3 h-3 text-emerald-400 flex-shrink-0" strokeWidth={2.4} />\n            {f}\n          </div>\n        ))}\n      </div>\n      {analysis.missingFields.length > 0 && (\n        <div className="pt-3 border-t border-white/[0.08]">\n          <div className="text-[10.5px] uppercase tracking-[0.14em] text-[#9A9488] mb-1.5 font-semibold">Still Needed</div>\n          {analysis.missingFields.map((f) => <div key={f} className="text-[12px] text-[#9A9488] leading-relaxed font-light">· {f}</div>)}\n        </div>\n      )}\n      <p className="mt-4 pt-3 border-t border-white/[0.08] text-[10.5px] text-[#777064] font-light leading-relaxed">Execution timeline and delivery are selected during Review and do not reduce matter-structuring confidence.</p>\n    </div>\n  );\n}\n'''
          rep('components/intake/SmartMatterIntake.tsx',old,new)

          # B. Canonical calculator accepts explicit zero instead of fabricating signature charges.
          rep('lib/pricing.ts', '''function toInt(value: unknown, fallback = 0): number {\n  const parsed = parseInt(String(value ?? ""), 10);\n  return Number.isFinite(parsed) && parsed > 0 ? parsed : fallback;\n}\n''', '''function toInt(value: unknown, fallback = 0): number {\n  const parsed = parseInt(String(value ?? ""), 10);\n  return Number.isFinite(parsed) && parsed > 0 ? parsed : fallback;\n}\n\nfunction toNonNegativeInt(value: unknown, fallback = 0): number {\n  if (value === null || value === undefined || value === "") return fallback;\n  const parsed = parseInt(String(value), 10);\n  return Number.isFinite(parsed) && parsed >= 0 ? parsed : fallback;\n}\n''')
          p=Path('lib/pricing.ts'); s=p.read_text()
          s=s.replace('''    toInt(\n      params.notarized_signature_count ??\n        params.signature_count ??\n        params.signatureCount,\n      signerCount,\n    ),''','''    toNonNegativeInt(\n      params.notarized_signature_count ??\n        params.signature_count ??\n        params.signatureCount,\n      0,\n    ),''',1)
          s=s.replace('''    toInt(\n      params.international_signer_count ?? params.internationalSignerCount,\n      0,\n    ),''','''    toNonNegativeInt(\n      params.international_signer_count ?? params.internationalSignerCount,\n      0,\n    ),''',1)
          s=s.replace('''    toInt(\n      params.apostille_count ?? params.apostilleCount,\n      toBool(params.apostille_required) ? 1 : 0,\n    ),''','''    toNonNegativeInt(\n      params.apostille_count ?? params.apostilleCount,\n      toBool(params.apostille_required) ? 1 : 0,\n    ),''',1)
          p.write_text(s)

          # C. Smart Intake projection delegates arithmetic to controlling calculatePrice.
          p=Path('lib/pricing/milanoPricingTruth.ts'); s=p.read_text()
          s=s.replace('import { INTERNAL_BASES } from "./pricingDoctrine";\n','import { calculatePrice } from "../pricing";\n')
          # remove now-obsolete second lane table
          a=s.index('const LANE_BASE: Record<"signature" | "priority" | "executive", number> = {')
          b=s.index('};',a)+3
          s=s[:a]+s[b:]
          s=s.replace('''  authorizedAddOns: { apostille?: number; rush?: number; additionalSigners?: number };\n''','''  authorizedAddOns: { apostille?: number; rush?: number; additionalSigners?: number };\n  clientLineItems: Array<{ key: string; label: string; amount: number }>;\n''',1)
          s=s.replace('''    authorizedAddOns: {},\n    additionalSignerCount: 0,''','''    authorizedAddOns: {},\n    clientLineItems: [],\n    additionalSignerCount: 0,''',1)
          s=s.replace('''  /** Explicit client lane selection (Signature/Priority/Executive), if any. */\n  selectedLane?: "signature" | "priority" | "executive";\n''','''  /** Explicit client lane selection (Signature/Priority/Executive), if any. */\n  selectedLane?: "signature" | "priority" | "executive";\n  timeline?: "" | "standard" | "expedited" | "urgent";\n  delivery?: "" | "digital" | "domestic_courier" | "international_courier";\n''',1)
          start=s.index('  const lane = input.selectedLane ?? "signature";')
          ret=s.index('  return {\n    commercialContext: ctx,\n    suggestedLane: lane,',start)
          block='''  const requestedLane = input.selectedLane ?? "signature";\n  const minimumLane: "signature" | "priority" | "executive" =\n    c.urgency === "urgent" || c.urgency === "same_day"\n      ? "executive"\n      : isRequired(c.apostille) || c.signerCount > 1\n        ? "priority"\n        : "signature";\n  const rank = { signature: 0, priority: 1, executive: 2 } as const;\n  const lane = rank[requestedLane] >= rank[minimumLane] ? requestedLane : minimumLane;\n  const urgency = input.timeline === "urgent" ? "rush" : input.timeline === "expedited" ? "expedited" : c.urgency === "same_day" ? "same_day" : c.urgency === "urgent" ? "rush" : "standard";\n  const shipping = input.delivery === "international_courier" ? "international" : input.delivery === "domestic_courier" ? "standard_domestic" : "none";\n  const canonical = calculatePrice({\n    tier: lane,\n    document_count: Math.max(1, c.documentCount || 1),\n    signer_count: Math.max(1, c.signerCount || 1),\n    notarized_signature_count: isRequired(c.notarization) || isRequired(c.ron) ? Math.max(1, c.signerCount || 1) : 0,\n    apostille_count: isRequired(c.apostille) ? Math.max(1, c.apostilleQuantity || 1) : 0,\n    urgency,\n    shipping,\n  });\n  const hidden = canonical.breakdown.filter((x) => x.internal_only).reduce((sum,x) => sum+x.amount,0);\n  const publicItems = canonical.breakdown.filter((x) => !x.internal_only);\n  const laneName = lane[0].toUpperCase()+lane.slice(1);\n  const clientLineItems = publicItems.map((x) => x.key === "base"\n    ? { key:x.key, label:`${laneName} Execution Lane`, amount:x.amount+hidden }\n    : { key:x.key, label:x.label, amount:x.amount });\n  const addOns: MilanoPricingResult["authorizedAddOns"] = {};\n  const apostilleItem=canonical.breakdown.find((x)=>x.key==="apostille");\n  const urgencyItem=canonical.breakdown.find((x)=>x.key==="urgency");\n  const signerItem=canonical.breakdown.find((x)=>x.key==="additional_signers");\n  if (apostilleItem) addOns.apostille=apostilleItem.amount;\n  if (urgencyItem) addOns.rush=urgencyItem.amount;\n  if (signerItem) addOns.additionalSigners=signerItem.amount;\n  const additionalSignerCount=Math.max(0,c.signerCount-1);\n  const total=canonical.total;\n  const parts=[`${laneName} Execution`];\n  if (apostilleItem) parts.push("Apostille Coordination");\n  if (urgencyItem) parts.push("Timeline Premium");\n  if (signerItem) parts.push(`${additionalSignerCount} Additional Signer${additionalSignerCount>1?"s":""}`);\n\n'''
          s=s[:start]+block+s[ret:]
          s=s.replace('''    laneBase,\n    authorizedAddOns: addOns,''','''    laneBase: canonical.base,\n    authorizedAddOns: addOns,\n    clientLineItems,''',1)
          p.write_text(s)

          # D. Unknown execution facts are blockers, not vague review text next to an unlocked quote.
          rep('lib/intake/reviewReadiness.ts','''  if (!(c.destinationCountry && c.destinationCountry.trim())) {\n    out.push("Destination country");\n  }\n\n  if (!timeline) out.push("Preferred execution timeline");''','''  if (!(c.destinationCountry && c.destinationCountry.trim())) {\n    out.push("Destination country");\n  }\n\n  if (c.notarization === "unknown") {\n    out.push("Notarization requirement");\n  } else if (c.notarization === "required" && c.ron === "unknown" && c.mobile === "unknown") {\n    out.push("Execution method (remote or in-person)");\n  }\n\n  if (!timeline) out.push("Preferred execution timeline");''')

          # E. Wizard uses timeline/delivery in the same pricing projection and sends immutable quote evidence.
          rep('components/intake/smart-intake-sop-wizard.tsx','''  const pricing = useMemo(() => priceSmartIntake({ classification, selectedLane: initialTier, commercialContext: "consumer" }), [classification, initialTier]);''','''  const pricing = useMemo(() => priceSmartIntake({ classification, selectedLane: initialTier, commercialContext: "consumer", timeline: form.timelineChoice, delivery: form.deliveryChoice }), [classification, initialTier, form.timelineChoice, form.deliveryChoice]);''')
          rep('components/intake/smart-intake-sop-wizard.tsx','''      source_channel: "Website Form",\n      name: form.name,''','''      source_channel: "Website Form",\n      tier: initialTier,\n      client_quoted_total: clientPricing.mode === "approved_price" ? clientPricing.amount : undefined,\n      pricing_engine_version: "canonical-pricing-v1",\n      name: form.name,''')
          rep('components/intake/smart-intake-sop-wizard.tsx','''      mobile: classification.mobile === "required",\n      apostille: classification.apostille === "required",''','''      mobile: classification.mobile === "required",\n      notarization_required: classification.notarization === "required",\n      ron_required: classification.ron === "required",\n      apostille: classification.apostille === "required",''')
          rep('components/intake/smart-intake-sop-wizard.tsx','''                  <div className="mt-5 flex items-baseline justify-between border-t border-[rgba(198,165,90,0.14)] pt-4">\n                    <span className="text-[11px] font-semibold uppercase tracking-[0.16em] text-[#9A9488]">Quoted Investment</span>\n                    <span className="text-2xl font-semibold text-white">{new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", minimumFractionDigits: 2 }).format(clientPricing.amount ?? 0)}</span>\n                  </div>''','''                  <div className="mt-5 border-t border-[rgba(198,165,90,0.14)] pt-4">\n                    <div className="mb-2 text-[9px] font-semibold uppercase tracking-[0.18em] text-[#9A9488]">Quote Breakdown</div>\n                    <div className="space-y-2">{pricing.clientLineItems.map((item) => (\n                      <div key={item.key} className="flex items-start justify-between gap-4 text-[12px] font-light text-[#E8DCC0]"><span>{item.label}</span><span className="shrink-0">{new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", minimumFractionDigits: 2 }).format(item.amount)}</span></div>\n                    ))}</div>\n                  </div>\n                  {courtesyCode && <div className="mt-4 flex items-start justify-between gap-4 border-t border-[rgba(198,165,90,0.14)] pt-4 text-[12px]"><span className="text-[#D8C08A]">Courtesy code</span><span className="font-semibold text-[var(--ms-gold)]">{courtesyCode} · validated securely at checkout</span></div>}\n                  <div className="mt-5 flex items-baseline justify-between border-t border-[rgba(198,165,90,0.14)] pt-4">\n                    <span className="text-[11px] font-semibold uppercase tracking-[0.16em] text-[#9A9488]">Quoted Investment</span>\n                    <span className="text-2xl font-semibold text-white">{new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", minimumFractionDigits: 2 }).format(clientPricing.amount ?? 0)}</span>\n                  </div>''')

          # F. Server recomputes with the same canonical engine, including selected timeline/delivery.
          rep('app/api/intake/route.ts','import { determineLaneAndPrice } from "@/lib/pricing";','import { calculatePrice, determineLaneAndPrice } from "@/lib/pricing";')
          rep('app/api/intake/route.ts','''    const pricing = determineLaneAndPrice(pricingInput);\n    const supabase = createAdminClient();''','''    const legacyPricing = determineLaneAndPrice(pricingInput);\n    const requestedTier=String(raw.tier??"").toLowerCase();\n    const requestedLane: "Signature"|"Priority"|"Executive" = requestedTier==="executive"?"Executive":requestedTier==="signature"?"Signature":requestedTier==="priority"?"Priority":autoLane;\n    const laneOrder=["Signature","Priority","Executive"] as const;\n    const pricedLane=laneOrder.indexOf(requestedLane)>=laneOrder.indexOf(autoLane)?requestedLane:autoLane;\n    const timeline=String(raw.timeline_preference??"");\n    const delivery=String(raw.delivery_method??"");\n    const canonicalPricing=calculatePrice({\n      tier:pricedLane.toLowerCase(),\n      document_count:Math.max(1,Number(data.docs??raw.docs??1)),\n      signer_count:Math.max(1,Number(data.signers??raw.signers??1)),\n      notarized_signature_count:raw.notarization_required===true||raw.ron_required===true?Math.max(1,Number(data.signers??raw.signers??1)):0,\n      apostille_count:Boolean(compliance?.apostille_required??data.apostille)?Math.max(1,Number(raw.apostille_count??1)):0,\n      urgency:timeline==="urgent"?"rush":timeline==="expedited"?"expedited":data.urgency??"standard",\n      shipping:delivery==="international_courier"?"international":delivery==="domestic_courier"?"standard_domestic":"none",\n    });\n    const pricing={lane:pricedLane,base:canonicalPricing.base,total:canonicalPricing.total,addons:canonicalPricing.breakdown.filter(x=>!x.internal_only&&x.key!=="base").map(x=>({item:x.label,amount:x.amount})),witness_total:legacyPricing.witness_total};\n    const clientQuotedTotal=Number(raw.client_quoted_total);\n    if(Number.isFinite(clientQuotedTotal)&&Math.abs(clientQuotedTotal-pricing.total)>0.009){\n      return NextResponse.json({error:"Pricing changed after server validation. Please review the updated matter scope before payment.",code:"PRICING_REVIEW_REQUIRED",quoted_total:clientQuotedTotal,authoritative_total:pricing.total},{status:409});\n    }\n    const supabase = createAdminClient();''')
          rep('app/api/intake/route.ts','''    const laneOrder = ["Signature", "Priority", "Executive"];\n    const finalLane =\n      laneOrder.indexOf(autoLane) > laneOrder.indexOf(pricing.lane)\n        ? autoLane\n        : pricing.lane;''','''    const finalLane = pricing.lane;''')
          rep('app/api/intake/route.ts','''      discount_code: courtesyAdjustment?.code ?? null,\n      discount_type: courtesyAdjustment?.discount_type ?? null,\n      discount_value: courtesyAdjustment?.discount_value ?? null,''','''      discount_code: courtesyAdjustment?.code ?? null,\n      discount_value: courtesyAdjustment?.discount_value ?? null,''')

          # G. Regression tests lock screenshot matter + zero-charge + confidence behavior.
          Path('tests/unit/intakePricingIntegrity.test.ts').write_text('''import { test } from "node:test";\nimport assert from "node:assert/strict";\nimport { calculatePrice } from "@/lib/pricing";\nimport { mergeAnalysis, emptyAnalysis } from "@/lib/intake/matterAnalysis";\n\ntest("canonical screenshot matter prices 2 docs + 2 apostilles + international courier",()=>{\n  const q=calculatePrice({tier:"priority",document_count:2,signer_count:1,notarized_signature_count:0,apostille_count:2,urgency:"standard",shipping:"international"});\n  assert.equal(q.total,1600);\n  assert.equal(q.breakdown.find(x=>x.key==="additional_documents")?.amount,75);\n  assert.equal(q.breakdown.find(x=>x.key==="apostille")?.amount,400);\n  assert.equal(q.breakdown.find(x=>x.key==="shipping")?.amount,150);\n});\n\ntest("explicit zero notarized signatures never fabricates $25",()=>{\n  const q=calculatePrice({tier:"priority",notarized_signature_count:0,apostille_count:0});\n  assert.equal(q.breakdown.some(x=>x.key==="notarized_signatures"),false);\n});\n\ntest("timeline preference does not reduce matter-structure confidence",()=>{\n  const a=mergeAnalysis(emptyAnalysis(),{country:"Colombia",documentType:"One and the Same Affidavit",documentDescription:"Two affidavits for apostille",signerCount:1,apostilleRequired:true,urgency:"standard"});\n  assert.equal(a.confidenceScore,100);\n  assert.equal(a.missingFields.includes("Preferred execution timeline"),false);\n});\n''')

          # one-shot cleanup
          Path('.github/workflows/apply-intake-pricing-integrity-v2.yml').unlink(missing_ok=True)
          PY
      - name: Verify complete production gate
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run build
          npm run validate:smart-intake-sop
          npm run validate:smart-intake-pricing-engine
          npm run validate:final-production-regression
      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Smart Intake confidence, canonical pricing, and courtesy checkout"
          git push origin HEAD:agent/intake-pricing-courtesy-integrity
