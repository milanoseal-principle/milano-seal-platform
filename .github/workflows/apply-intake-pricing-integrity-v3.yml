name: Apply Smart Intake Pricing Integrity V3

on:
  push:
    branches:
      - agent/intake-pricing-courtesy-integrity

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/intake-pricing-courtesy-integrity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply verified V2 source patch
        shell: bash
        run: |
          awk '/python3 <<'"'"'PY'"'"'/{flag=1;next} flag && /^          PY$/{exit} flag{sub(/^          /,"");print}' .github/workflows/apply-intake-pricing-integrity-v2.yml > /tmp/intake_patch.py
          python3 /tmp/intake_patch.py
          rm -f .github/workflows/apply-intake-pricing-integrity-v3.yml
      - name: Verify production gate
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npm run validate:smart-intake-sop
          npm run validate:smart-intake-pricing-engine
          npm run validate:final-production-regression
      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Smart Intake confidence, canonical pricing, and courtesy checkout"
          git push origin HEAD:agent/intake-pricing-courtesy-integrity
