name: Milano Seal PR CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: milano-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # Disposable PostgreSQL for P23 stage 18 parallel-session certification only.
      # Loopback-only, no secrets, destroyed with the job; production is never contacted.
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so protected-file diff guards can resolve origin/main
          # (final-branch-salvage-audit fails closed without a base commit).
          fetch-depth: 0

      - name: Offline backup integrity regressions
        run: python3 scripts/backups/test_backups.py -v

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate package JSON
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('JSON OK')"

      - name: Diff check
        run: git diff --check

      - name: Duplicate-source corruption gate
        run: npm run validate:duplicate-source

      - name: Visual-system hardening gate
        run: node scripts/validate-final-visual-system-hardening.mjs

      - name: Cinematic UI validator
        run: npm run validate:cinematic-ui-system

      - name: Cinematic route coverage
        run: npm run validate:cinematic-route-coverage

      - name: Responsive safety
        run: npm run validate:responsive-safety

      - name: Final mobile cosmetic pass
        run: npm run validate:final-mobile-cosmetic-pass

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Production governance
        run: npm run validate:production-governance

      - name: Full system hardening
        run: node scripts/validate-full-system-hardening.mjs

      - name: Migration chain
        run: npm run validate:migration-chain

      - name: AI governance charter and placement boundary
        run: npm run validate:ai-governance

      - name: AI governance PostgreSQL authorization and concurrency
        run: npm run test:ai-governance-database

      - name: Tiffany Damiani and global intelligence safe regression suites
        run: npm run test:ai-governance-regressions

      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: P19 through P23 safe source certification suites
        run: npm run test:production-certification-source

      - name: P23 parallel-session concurrency certification
        env:
          P23_CONCURRENCY_PGHOST: 127.0.0.1
          P23_CONCURRENCY_PGUSER: postgres
          P23_CONCURRENCY_SERVICE_CONTAINER: "true"
        run: npm run certify:p23-concurrency

      - name: Clean dependency-aware migration replay
        run: npm run test:migration-replay

      - name: Upgrade and isolated physical restore
        run: npm run test:upgrade-restore

      - name: Financial custody release authorization regressions
        run: npm run test:gap-closure-database

      - name: P3 atomic domestic Matter database regression
        run: npm run test:p3-database

      - name: P4 RON evidence database regression
        run: npm run test:p4-database

      - name: P5 RON security incident database regression
        run: npm run test:p5-database

      - name: Wise-only active operations
        run: node scripts/validate-wise-only-active-ops-docs.mjs

      - name: TIFF real 15-step certification contract
        run: npm run validate:tiff-15-step-production-certification

      - name: Damiani production wiring
        run: npm run validate:damiani-production-wiring

      - name: Production build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run build

      - name: Smart Intake SOP validator
        run: npm run validate:smart-intake-sop

      - name: Route registry validator
        run: npm run validate:route-registry

      - name: Pre-execution validator
        run: npm run validate:milano-pre-execution

      - name: Alliance platform validator
        run: npm run validate:trust-alliance-platform

      - name: Topical authority validator
        run: npm run validate:topical-authority-engine

      - name: Final production regression
        run: npm run validate:final-production-regression

      - name: Install browser for P3 controlled rendered acceptance
        run: npx playwright install --with-deps chromium

      - name: Operational cleanup browser regression
        run: node scripts/test-operational-cleanup-rendered.mjs

      - name: AI governance controlled rendered acceptance
        run: npm run test:ai-governance-rendered

      - name: P3 controlled rendered acceptance
        run: npm run test:p3-rendered

      - name: Upload P3 controlled UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-controlled-ui-evidence
          path: artifacts/proof/p3-controlled/
          if-no-files-found: ignore

      - name: Upload governance and source certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-and-gap-closure-evidence
          path: |
            artifacts/governance/
            artifacts/gap-closure/
          if-no-files-found: warn
