name: Finalize Intake Quote Integrity

on:
  push:
    branches:
      - agent/intake-pricing-courtesy-integrity

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/intake-pricing-courtesy-integrity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Final source alignment
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p=Path('lib/pricing/milanoPricingTruth.ts')
          s=p.read_text()
          old='''  const hidden = canonical.breakdown.filter((x) => x.internal_only).reduce((sum,x) => sum+x.amount,0);\n  const publicItems = canonical.breakdown.filter((x) => !x.internal_only);'''
          new='''  // Quote-safe disclosure: courier/shipping is a required disclosed quote charge.\n  // Other internal-only operational components remain rolled into the lane line.\n  const hidden = canonical.breakdown\n    .filter((x) => x.internal_only && x.key !== "shipping")\n    .reduce((sum,x) => sum+x.amount,0);\n  const publicItems = canonical.breakdown.filter((x) => !x.internal_only || x.key === "shipping");'''
          if old not in s: raise SystemExit('pricing disclosure marker missing')
          p.write_text(s.replace(old,new,1))

          p=Path('components/intake/smart-intake-sop-wizard.tsx')
          s=p.read_text()
          old='''      // Timeline/delivery are captured as operator-facing preferences, not\n      // billing inputs: the client-displayed quote and the server billing\n      // engine both derive urgency from the classification, so a selector must\n      // never silently change the amount billed vs. the amount shown. Rush /\n      // expedited pricing is confirmed by the operator at review.\n'''
          new='''      // Timeline/delivery are explicit quote inputs. Client projection and\n      // server recomputation consume the same selections so the accepted\n      // quote cannot diverge from the amount persisted for Wise checkout.\n'''
          if old not in s: raise SystemExit('wizard comment marker missing')
          p.write_text(s.replace(old,new,1))

          Path('.github/workflows/finalize-intake-quote-integrity.yml').unlink(missing_ok=True)
          PY
      - name: Verify
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npm run validate:smart-intake-sop
          npm run validate:smart-intake-pricing-engine
          npm run validate:final-production-regression
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align Smart Intake quote disclosure with canonical pricing"
          git push origin HEAD:agent/intake-pricing-courtesy-integrity
