name: AI Governance Rendered Acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/control-plane/governance/**'
      - 'components/control-plane/GovernanceBoardRoom.tsx'
      - 'app/dashboard/control-plane/**'
      - 'app/api/dashboard/control-plane/**'
      - 'scripts/test-ai-governance-rendered.mjs'
      - 'tests/fixtures/AIGovernanceProof.tsx'
      - '.github/workflows/ai-governance-rendered.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  governance-rendered:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ai-governance-rendered
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: controlled-governance-rendered
          path: artifacts/governance/rendered
